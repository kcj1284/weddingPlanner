spring.application.name=cheongmo
cheongmo.public-url=${PUBLIC_BASE_URL:http://localhost:8080}
cheongmo.mail-from=${MAIL_FROM:}
cheongmo.mail-transport=${MAIL_TRANSPORT:smtp}
cheongmo.brevo-api-key=${BREVO_API_KEY:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.sql.init.mode=never
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.flyway.enabled=true
cheongmo.kakao-key=${KAKAO_REST_API_KEY:}
cheongmo.invite-code-key=${INVITE_CODE_ENCRYPTION_KEY:}
cheongmo.kakao-javascript-key=${KAKAO_JAVASCRIPT_KEY:}
cheongmo.naver-search-id=${NAVER_SEARCH_CLIENT_ID:}
cheongmo.naver-search-secret=${NAVER_SEARCH_CLIENT_SECRET:}
